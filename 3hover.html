<style>
    
    .subscribe-button{
        background-color: rgb(204, 0, 0);
        color: white;
        border: none;
        height: 36px;
        width: 100;
        border-radius: 2px;
        cursor: pointer;
        margin-right: 10px;
        margin-bottom: 10px;
        transition: opacity 0.15s;
    }

    .subscribe-button:hover{
       opacity: 0.6;
    }
    .subscribe-button:active{
        opacity: 0.3;
    }
    .join-button{
        background-color: white;
        border-color: rgba(56, 114, 223, 0.822);
        border-style: solid;
        border-width: 1px;
        color: rgba(56, 114, 223, 0.822);
        border-radius: 2px;
        height: 36px;
        width: 62px;
        cursor: pointer;
        margin-bottom: 10px;
        transition: background-color 0.15s,
        color 1s;
    }
    .join-button:hover{
        background-color: rgb(16, 64, 223);
        color: white ;
    }
    .join-button:active{
        opacity: 0.5;
    }
    .tweet-button{
        background-color: rgb(53, 90, 211);
        border: none;
        height: 36px;
        width: 75px;
        color: white;
        border-radius: 18px;
        font-weight: bold;
        font-size: 15px;
        cursor: pointer;
        margin-left: 10px;
        margin-bottom: 10px;
        transition: box-shadow 0.15s;
        
    }
    .tweet-button:hover{
        box-shadow: 5px 5px 10px rgba(0, 0, 0, 0.15);
    }
    
</style>


 

<button class="subscribe-button">
    SUBSCRIBE
</button>
<br>
<button class="join-button">
    JOIN
</button>
<br>
<button class="tweet-button">
    TWEET
</button>
<br>
